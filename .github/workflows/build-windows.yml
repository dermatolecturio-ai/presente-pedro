name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install PyTorch
        run: python -m pip install torch
        # CPU wheel on GitHub-hosted runners is fine for packaging;
        # the user's NVIDIA GPU is used at runtime if drivers are present.

      - name: Install project deps and PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      - name: Download ffmpeg essentials
        shell: pwsh
        run: |
          $FfmpegRoot = "packaging/windows/ffmpeg"
          $FfmpegBin = Join-Path $FfmpegRoot "bin"
          $Zip = Join-Path $env:TEMP "ffmpeg-release-essentials.zip"
          $Url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $Url -OutFile $Zip
          $Extract = Join-Path $env:TEMP "ffmpeg-extract"
          if (Test-Path $Extract) { Remove-Item -Recurse -Force $Extract }
          Expand-Archive -Path $Zip -DestinationPath $Extract -Force
          $Inner = Get-ChildItem $Extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path $FfmpegRoot | Out-Null
          if (Test-Path $FfmpegBin) { Remove-Item -Recurse -Force $FfmpegBin }
          Copy-Item -Recurse (Join-Path $Inner.FullName "bin") $FfmpegBin
          if (-not (Test-Path (Join-Path $FfmpegBin "ffmpeg.exe"))) {
            throw "ffmpeg.exe missing after download"
          }

      - name: PyInstaller build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging/windows/PresentePedro.spec
          $Out = "dist/PresentePedro"
          if (-not (Test-Path "$Out/PresentePedro.exe")) { throw "PresentePedro.exe missing" }
          $OutFfmpeg = Join-Path $Out "ffmpeg"
          if (-not (Test-Path "$OutFfmpeg/bin/ffmpeg.exe")) {
            Copy-Item -Recurse -Force "packaging/windows/ffmpeg" $OutFfmpeg
          }
          Copy-Item "GUIA-PARA-O-PEDRO.md" (Join-Path $Out "GUIA-PARA-O-PEDRO.md") -Force
          Set-Content -Path (Join-Path $Out "LEIA-ME.txt") -Encoding UTF8 -Value @(
            "Presente do Victor Prudencio para O Pedro",
            "1) Extraia este zip",
            "2) Abra PresentePedro.exe",
            "3) Leia GUIA-PARA-O-PEDRO.md",
            "Tudo roda LOCAL no PC (modelo no dispositivo)."
          )

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/PresentePedro\*" -DestinationPath "PresentePedro-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresentePedro-windows
          path: PresentePedro-windows.zip
          if-no-files-found: error
          retention-days: 14
